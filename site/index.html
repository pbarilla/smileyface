<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smileyface</title>
<meta name="description" content="An acid bass line for the FM-1. One voice, sixteen steps, knobs to twist.">
<style>
  :root { --y:#ffee00; --k:#000; --lime:#a0ff00; --pink:#ff24aa; --cy:#00e2ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--k); color:var(--y); font:16px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
         background-image:conic-gradient(#16180a 25%, #000 0 50%, #16180a 0 75%, #000 0); background-size:88px 88px; }
  main { max-width:760px; margin:0 auto; padding:48px 16px 72px; }
  h1 { font-size:56px; margin:0 0 8px; letter-spacing:.02em; }
  p { margin:0 0 12px; max-width:34em; }
  a { color:var(--cy); }
  .shots { display:grid; grid-template-columns:repeat(5, 1fr); gap:10px; margin:28px 0 0; }
  .shots img { width:100%; height:auto; display:block; image-rendering:pixelated; }
  @media (max-width:560px) { .shots { grid-template-columns:repeat(2, 1fr); } }
  .btns { display:flex; flex-wrap:wrap; gap:12px; margin:24px 0; }
  .btn { display:inline-block; padding:12px 20px; background:var(--y); color:var(--k); text-decoration:none; font-weight:700; }
  .btn.alt { background:var(--k); color:var(--pink); box-shadow:inset 0 0 0 2px var(--pink); }
  footer { margin-top:48px; font-size:14px; color:#8a8a50; }
</style>
</head>
<body>
<main>
  <h1>Smileyface</h1>
  <p>An acid bass line for the FM-1. One voice, sixteen steps, and knobs made to be twisted.</p>
  <div class="btns">
    <a class="btn" href="play/">Play online</a>
    <a class="btn alt" href="install.html">Install</a>
    <a class="btn alt" href="guide/">Guide</a>
    <a class="btn alt" href="cheatsheet/">Cheat sheet</a>
    <a class="btn alt" href="https://github.com/pbarilla/smileyface">Source</a>
  </div>
  <div class="shots">
    <img src="img/steps.png" alt="Steps">
    <img src="img/fly.png" alt="Fly">
    <img src="img/walk.png" alt="Walk">
    <img src="img/play.png" alt="Play">
    <img src="img/projects.png" alt="Projects">
  </div>
  <footer>GPL-3.0-only. Built on Felucca, SLOOP and Dinghy. See LICENSING.md.</footer>
</main>
</body>
</html>
