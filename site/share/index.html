<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share · Smileyface</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color:var(--ink); }
  main { max-width:680px; margin:0 auto; padding:32px 16px 72px; }
  nav { display:flex; flex-wrap:wrap; gap:6px 18px; margin-bottom:26px; font-size:14px; }
  h1 { font:900 clamp(32px, 8vw, 50px)/1 "Arial Black", Impact, sans-serif; margin:0 0 20px; letter-spacing:-.04em; text-transform:uppercase; color:var(--y); text-shadow:3px 3px 0 var(--pink), -3px -3px 0 var(--cy); }
  .tag { display:inline-block; padding:2px 10px; background:var(--y); color:#000; font:700 13px ui-monospace, Menlo, monospace; letter-spacing:.12em; vertical-align:middle; margin-left:10px; text-shadow:none; }
  p { margin:0 0 12px; }
  button, .btn { font:inherit; font-size:14px; font-weight:700; background:var(--y); color:#000; border:2px solid #000; box-shadow:3px 3px 0 var(--pink); padding:8px 16px; cursor:pointer; text-transform:none; letter-spacing:0; }
  button.alt, .btn.alt { background:#1c1a06; color:var(--ink); border:1px solid var(--line); box-shadow:none; }
  button.warn { background:var(--pink); color:#000; }
  button:disabled { opacity:.3; cursor:default; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:12px 14px; background:rgba(12,12,6,.92); border-left:6px solid var(--line); margin-bottom:6px; }
  .row .n { width:2ch; color:var(--dim); }
  .row .what { flex:1 1 180px; min-width:0; }
  .row .what small { display:block; color:var(--dim); font-size:13px; }
  .row.open { border-left-color:var(--lime); }
  .btns { display:flex; flex-wrap:wrap; gap:6px; }
  #status { margin:16px 0; min-height:1.55em; }
  #bar { width:100%; height:6px; display:none; accent-color:var(--pink); }
  .small { color:var(--dim); font-size:14px; }
  input[type=file] { display:none; }
  body.busy button, body.busy .btn { opacity:.4; pointer-events:none; }
</style>
<link rel="stylesheet" href="../acid.css">
</head>
<body>
<main>
  <nav><a href="../">Home</a><a href="../guide/">Guide</a><a href="../play/">Play online</a><a href="../cheatsheet/">Cheat sheet</a><a href="../install.html">Install</a></nav>
  <h1><a href="../">Smileyface</a><span class="tag">SHARE</span></h1>
  <p>Backup your projects, show them off to your mates, or load theirs on your device! Ya'll making acid!</p>
  <p><button id="connect">Connect ya FM-1</button></p>
  <progress id="bar" max="100" value="0"></progress>
  <p id="status"></p>
  <div id="mine" hidden>
    <div id="slots"></div>
    <p class="btns" style="margin-top:14px"><button id="backup" class="alt">Create backup</button> <button id="restore" class="alt">Restore backup</button></p>
    <p id="confirm" hidden></p>
  </div>
  <input type="file" id="pick" accept=".smileyface,application/json">
</main>
<script type="module" src="../js/share.js"></script>
</body>
</html>
